spring.application.name=MediLink AI

# H2 file database (zero install, data kept in ./data folder)
spring.datasource.url=jdbc:h2:file:./data/medilink;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# H2 web console for debugging: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# File upload limits (prescription images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Folder where uploaded prescription images are stored
medilink.upload-dir=uploads

# Tesseract tessdata folder (only needed for real OCR; fallback works without it)
medilink.tessdata=tessdata

server.port=8081
